{% extends "base.html" %}

{% block title %}Search{% endblock %}

{% block content %}
    <h1>Search Trails</h1>

    <form method="get">
        <input type="text" name="q" value="{{ query }}">
        <button type="submit">Search</button>
    </form>

    {% if query %}
        <p>You searched for: {{ query }}</p>
    {% else %}
        <p>Enter a search term.</p>
    {% endif %}
{% endblock %}
