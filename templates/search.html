{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <h1>Search Trails</h1>

    <form method="get">
        <input type="text" name="q" value="{{ query }}">
        <button type="submit">Search</button>
    </form>

    {% if query %}
        <p>You searched for: {{ query }}</p>
    {% else %}
        <p>Enter a search term.</p>
    {% endif %}

</body>
</html>
